# yadiggg: Official ALSA Configuration Spec
# Location: /etc/asound.conf (Yocto Embedded Linux RootFS target)
# Date: Friday, June 5, 2026
# Status: Production Configuration V1.0

# Define the physical hardware PDM digital microphone capture card.
# The i.MX 8M Nano maps the digital PDM microphone decimate interface to hardware card 0, device 0.
pcm.pdm_hw {
    type hw
    card 0
    device 0
    subdevice 0
}

# Configure a software conversion wrapper (plug plugin) around our physical PDM card.
# This automatically handles audio rate conversion, bit-depth transformations (e.g. S32_LE to S16_LE),
# and channels routing while enforcing low-latency ALSA ring buffers.
pcm.pdm_capture {
    type plug
    slave {
        pcm "pdm_hw"
        format S16_LE         # Enforce 16-bit Signed Little Endian output format
        rate 44100            # Decimate hardware clock to a clean 44.1kHz PCM sampling rate
        channels 1            # Combine stereo PDM lines to a consolidated mono capture stream
    }
    # Decouple reader threads with an optimized buffer allocation to prevent overruns (Test FW-04)
    hint {
        show on
        description "yadiggg PDM Digital Microphone array capture plugin"
    }
}

# Override default capture routing to prioritize our PDM microphone plug pipeline.
# This ensures that any standard ALSA application calling 'default' automatically captures
# from our noise-isolated Knowles digital microphone array.
pcm.!default {
    type asym
    playback.pcm {
        type plug
        slave.pcm "hw:0,1"    # Route playback out to our ESS Sabre DAC (hw:0,1)
    }
    capture.pcm {
        type plug
        slave.pcm "pdm_capture" # Route capture in from our Knowles digital mic array (pdm_capture)
    }
}

# Control parameters for default ALSA mixer settings
ctl.!default {
    type hw
    card 0
}
